on:
  pull_request:
    - workflows: [ci]
      filter:
        source_branches: ["**"]
        target_branches: ["main"]

  push:
    - workflows: [ci]
      filter:
        branches: ["main"]

workflows:
  ci:
    settings:
      max_cube_duration: 30m

    tasks:
      - name: ocaml-ci

        cubes:
          - name: checks
            image: ubuntu:24.04

            script:

              - apt-get update

              - >
                DEBIAN_FRONTEND=noninteractive
                apt-get install -y
                ca-certificates
                git
                opam
                build-essential
                pkg-config
                m4
                rsync
                llvm-18
                llvm-18-dev

              - cd "$SOURCECRAFT_WORKSPACE"

              - git config --global --add safe.directory "$SOURCECRAFT_WORKSPACE"

              - opam init --disable-sandboxing --yes

              - opam update

              - >
                opam switch create 5.5.1
                ocaml-base-compiler.5.5.1
                --yes

              - >
                opam install
                --switch=5.5.1
                .
                --deps-only
                --with-test
                --with-doc
                --yes

              - >
                opam install
                --switch=5.5.1
                ocamlformat.0.29.0
                odoc
                --yes

              - >
                opam pin add
                --switch=5.5.1
                zanuda
                git+https://github.com/Kakadu/zanuda.git#master
                --yes


              - opam exec --switch=5.5.1 -- ocamlc --version
              - opam exec --switch=5.5.1 -- ocamlformat --version
              - opam exec --switch=5.5.1 -- dune --version


              # Compilation
              - opam exec --switch=5.5.1 -- dune build

              # Formatting
              - opam exec --switch=5.5.1 -- dune build @fmt

              # Documentation
              - opam exec --switch=5.5.1 -- dune build @doc

              # Tests
              - opam exec --switch=5.5.1 -- dune runtest

              # Linter
              - opam exec --switch=5.5.1 -- zanuda -dir .